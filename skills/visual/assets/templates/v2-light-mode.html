<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DecoupleAI Card — V2 Research Notes</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #dde1e8;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 40px 20px;
  font-family: 'SF Pro Display', -apple-system, 'PingFang SC', system-ui, sans-serif;
}

/* ── Card shell ── */
.card {
  width: 540px;
  background: #fefefe;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.07), 0 10px 40px rgba(0,0,0,0.12);
  position: relative;
}

/* Graph paper grid */
.card::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(59,130,246,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.045) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none; z-index: 0;
}

/* Red margin rule */
.card::after {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 52px;
  width: 1px; background: rgba(239,68,68,0.15);
  pointer-events: none; z-index: 2;
}

.content { position: relative; z-index: 1; }

/* ── Header ── */
.header {
  padding: 28px 28px 22px 66px;
  border-bottom: 1px solid #e5e7eb;
}
.header-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #16a34a; margin-bottom: 10px;
}
.header-title {
  font-size: 21px; font-weight: 800; color: #0f172a;
  line-height: 1.25; margin-bottom: 7px; letter-spacing: -0.3px;
}
.header-desc { font-size: 12.5px; color: #6b7280; line-height: 1.6; }

/* ── Correction block ── */
.correction { padding: 18px 28px 18px 66px; border-bottom: 1px solid #e5e7eb; }

.wrong-block {
  padding: 13px 16px 12px;
  background: #fafafa;
  border: 1px solid #e5e7eb;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  position: relative; overflow: hidden;
}
/* diagonal hatch on wrong block */
.wrong-block::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 7px,
    rgba(0,0,0,0.018) 7px, rgba(0,0,0,0.018) 14px
  );
  pointer-events: none;
}

.block-label {
  font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
  position: relative;
}
.wrong-block .block-label { color: #9ca3af; }
.wrong-block .block-text {
  font-size: 13px; color: #9ca3af;
  text-decoration: line-through; text-decoration-color: #d1d5db;
  line-height: 1.55; position: relative;
}

.right-block {
  padding: 13px 16px 12px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-top: 2px solid #16a34a;
  border-radius: 0 0 8px 8px;
}
.right-block .block-label { color: #15803d; }
.right-block .block-text {
  font-size: 13px; font-weight: 600; color: #0f172a; line-height: 1.55;
}

/* ── Steps ── */
.steps { padding: 18px 28px 18px 66px; border-bottom: 1px solid #e5e7eb; }
.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #d1d5db; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: #f0f0f0; }

.step-list { position: relative; }
.step-list::before {
  content: '';
  position: absolute; left: 12px; top: 22px; bottom: 12px;
  width: 1px;
  background: linear-gradient(to bottom, #16a34a 0%, #bbf7d0 100%);
}
.step {
  display: flex; gap: 14px; align-items: flex-start; padding: 9px 0;
}
.step-dot {
  width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  position: relative; z-index: 1;
  box-shadow: 0 0 0 3px #fefefe;
}
.step:nth-child(1) .step-dot { background: #2563eb; }
.step:nth-child(2) .step-dot { background: #7c3aed; }
.step:nth-child(3) .step-dot { background: #059669; }

.step-content { padding-top: 3px; }
.step-title { font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 2px; }
.step-desc { font-size: 12px; color: #6b7280; line-height: 1.5; }

/* ── Metaphor ── */
.metaphor {
  padding: 16px 28px 16px 66px;
  border-bottom: 1px solid #e5e7eb;
  display: flex; gap: 12px; align-items: flex-start;
}
.metaphor-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.metaphor-label {
  font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #16a34a; margin-bottom: 4px;
}
.metaphor-text { font-size: 13px; color: #374151; line-height: 1.55; font-weight: 500; }

/* ── Quote ── */
.quote { padding: 16px 28px 22px 66px; }
.quote-inner {
  padding: 16px 20px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  text-align: center;
}
.quote-text { font-size: 13.5px; font-weight: 600; color: #0f172a; line-height: 1.65; font-style: italic; }

/* ── Footer ── */
.footer {
  padding: 13px 28px 13px 66px;
  border-top: 1px solid #f0f0f0;
  display: flex; justify-content: space-between; align-items: center;
  background: #f9fafb;
}
.brand { font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #d1d5db; }
.brand span { color: #16a34a; }
.meta { font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>
<div class="card">
  <div class="content">

    <div class="header">
      <div class="header-tag">基石解耦 · {{COLUMN}}</div>
      <div class="header-title">{{TITLE}}</div>
      <div class="header-desc">{{SUBTITLE}}</div>
    </div>

    <div class="correction">
      <div class="wrong-block">
        <div class="block-label">✕ &nbsp;误解</div>
        <div class="block-text">{{MISCONCEPTION}}</div>
      </div>
      <div class="right-block">
        <div class="block-label">✓ &nbsp;真相</div>
        <div class="block-text">{{TRUTH}}</div>
      </div>
    </div>

    <div class="steps">
      <div class="section-title">Structure Map</div>
      <div class="step-list">
        <div class="step">
          <div class="step-dot">1</div>
          <div class="step-content">
            <div class="step-title">{{STEP_1_TITLE}}</div>
            <div class="step-desc">{{STEP_1_DESC}}</div>
          </div>
        </div>
        <div class="step">
          <div class="step-dot">2</div>
          <div class="step-content">
            <div class="step-title">{{STEP_2_TITLE}}</div>
            <div class="step-desc">{{STEP_2_DESC}}</div>
          </div>
        </div>
        <div class="step">
          <div class="step-dot">3</div>
          <div class="step-content">
            <div class="step-title">{{STEP_3_TITLE}}</div>
            <div class="step-desc">{{STEP_3_DESC}}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="metaphor">
      <span class="metaphor-icon">💡</span>
      <div>
        <div class="metaphor-label">一秒看懂</div>
        <div class="metaphor-text">{{METAPHOR}}</div>
      </div>
    </div>

    <div class="quote">
      <div class="quote-inner">
        <div class="quote-text">"{{INSIGHT}}"</div>
      </div>
    </div>

    <div class="footer">
      <span class="brand"><span>Decouple</span>AI</span>
      <span class="meta">{{DATE}}</span>
    </div>

  </div>
</div>
</body>
</html>
